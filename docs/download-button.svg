<svg width="640" height="96" viewBox="0 0 640 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Download Purser for macOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7CF6"/>
      <stop offset="0.55" stop-color="#6D5AE6"/>
      <stop offset="1" stop-color="#4F3FD1"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- button body -->
  <rect x="3" y="3" width="634" height="90" rx="24" fill="url(#bg)"/>
  <rect x="3" y="3" width="634" height="90" rx="24" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="1.6"/>
  <!-- top gloss -->
  <rect x="6" y="6" width="628" height="42" rx="21" fill="url(#gloss)"/>
  <!-- bottom edge shade -->
  <rect x="4" y="88" width="632" height="4" rx="2" fill="#241A5C" fill-opacity="0.28"/>

  <!-- ledger bar-chart mark: rounded tops, square baseline (matches the app icon) -->
  <g fill="#FFFFFF">
    <rect x="49" y="52" width="8.5" height="18" rx="3" />
    <rect x="62" y="42" width="8.5" height="28" rx="3" />
    <rect x="75" y="33" width="8.5" height="37" rx="3" />
    <rect x="88" y="46" width="8.5" height="24" rx="3" opacity="0.8" />
  </g>
  <rect x="47" y="70" width="52" height="4" rx="2" fill="#FFFFFF"/>

  <!-- label -->
  <text x="122" y="44" font-family="-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Download Purser</text>
  <text x="122" y="70" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14" font-weight="500" fill="#FFFFFF" fill-opacity="0.82">macOS · Apple Silicon · .dmg</text>

  <!-- download glyph -->
  <circle cx="582" cy="48" r="23" fill="#FFFFFF" fill-opacity="0.17"/>
  <circle cx="582" cy="48" r="23" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4"/>
  <path d="M582 35v17.5M573.5 44.5l8.5 8.5 8.5-8.5" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M572 60.5h20" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
</svg>
